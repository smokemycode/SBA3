<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <title>Fylo data storage component</title>

</head>
<body class="flex flex-col justify-center items-center min-h-screen p-6 font-sans relative overflow-hidden">
  <main class="flex flex-col w-full max-w-sm md:max-w-4xl md:flex-row md:items-end gap-4 md:gap-8 relative">

    <!-- Top/Left Card -->
    <section class="bg-[#1D2C67] rounded-[0.625rem_5rem_0.625rem_0.625rem] p-10 md:w-80 md:shrink-0">
      <div>
        <img src="./images/logo.svg" alt="Fylo logo">
      </div>
      <div class="flex gap-4 pt-6">
        <button type="button" class="w-12 h-12 flex items-center justify-center bg-[#0C122C] rounded-lg"><img src="./images/icon-document.svg" alt=""></button>
        <button type="button" class="w-12 h-12 flex items-center justify-center bg-[#0C122C] rounded-lg"><img src="./images/icon-folder.svg" alt=""></button>
        <button type="button" class="w-12 h-12 flex items-center justify-center bg-[#0C122C] rounded-lg"><img src="./images/icon-upload.svg" alt=""></button>
      </div>
    </section>
    
    <!-- Bottom/Right Card -->
    <section class="bg-[#1D2C67] rounded-xl p-8 pt-9 pb-12 md:p-9 md:pt-12 md:flex-1 md:max-w-md text-center relative">
      <p class="text-white text-sm mb-3 md:text-left">
        You’ve used <span class="font-bold text-white">815 GB</span> of your storage
      </p>

      <!-- Progress Bar -->
      <div class="w-full h-5 bg-[#0c122c] rounded-full relative">
        <div class="absolute inset-y-0 left-0 w-[81.5%] bg-gradient-to-r from-[#ffa399] to-[#ff4d97] rounded-full flex items-center justify-end pr-1">
          <div class="w-3.5 h-3.5 bg-white rounded-full"></div>
        </div>
      </div>

      <div class="flex justify-between text-xs font-bold text-white mt-2">
        <span>0 GB</span>
        <span>1000 GB</span>
      </div>

      <div class="absolute left-1/2 -translate-x-1/2 -bottom-8 bg-white rounded-xl px-6 py-3 flex justify-center items-center gap-2 shadow-lg md:left-auto md:translate-x-0 md:right-8 md:-top-14 md:bottom-auto">
        <span class="text-5xl font-bold text-[#0c122c]">185</span>
        <span class="text-xs font-semibold text-[#8b95c9]">GB LEFT</span>
      </div>
    </section>
  </main>
</body>
</html>
